<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物設定卡預覽｜NCCU100</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef5f3;color:#243c3c;font:16px system-ui,sans-serif}header{padding:16px 24px;background:white}h1{margin:6px 0;font-size:25px}main{display:grid;grid-template-columns:330px minmax(0,1fr)}aside{padding:20px;background:white}label{display:block;margin:12px 0 5px}select,button,textarea{font:inherit;width:100%;padding:10px;border:1px solid #aec7bf;border-radius:9px;color:inherit;background:white}button{margin:6px 0;cursor:pointer}button:disabled,select:disabled{opacity:.5}textarea{font:12px monospace;height:140px;resize:vertical}.primary{background:#267b68;color:white}small{display:block;line-height:1.5;margin:10px 0}#view{height:calc(100vh - 130px);min-height:500px;overflow:hidden}canvas{display:block;touch-action:none}#status{white-space:pre-wrap;background:#e7f2ec;padding:12px;border-radius:8px}a{color:#206d64}@media(max-width:700px){main{grid-template-columns:1fr}#view{grid-row:1;height:55vh;min-height:300px}aside{padding:15px}}
</style></head><body><header><a href="../index.html">返回遊戲</a> · <a href="../wardrobe/index.html">原四角色換裝</a><h1>人物設定卡預覽</h1><span>三套原有服裝，試驗資料化零件與集中遮藏。尚未套用正式遊戲。</span></header><main><aside>
<label for="actor">角色</label><select id="actor" disabled></select><div id="parts"></div>
<label for="pose">預覽姿勢</label><select id="pose" disabled><option value="neutral">站立</option><option value="walk">步行關鍵姿勢</option><option value="wave">揮手關鍵姿勢</option></select>
<button id="reset" disabled>還原原本全部零件</button><button id="front" disabled>正面</button><button id="side" disabled>側面</button><button id="back" disabled>背面</button>
<p id="status" role="status" aria-live="polite">正在載入……</p><label for="json">設定卡 JSON</label><textarea id="json" maxlength="4096" spellcheck="false"></textarea><button id="export" class="primary" disabled>匯出設定卡</button><button id="import" disabled>載入設定卡並儲存本機</button>
<small>原樣：不改動原件。卸下：暫藏該類零件。裝配：以 catalog 原件 adapter 重新裝配。長袍會遮住上衣與褲子，卸下長袍後依其他選件還原。</small>
<small>僅預覽，獨立本機儲存；不讀寫遊戲存檔或 wardrobe v1。三角色不跨穿服裝，未開放調色、尺寸、真肘膝或全角色設定卡。拖曳旋轉、滾輪縮放。</small>
</aside><section id="view" aria-label="三維人物設定卡預覽"></section></main><script type="module" src="../dev/character-cards-preview.js"></script></body></html>
