name: 四維堂活動拱門實景驗收
on:
  pull_request:
    paths: ['src/main.js', 'src/systems/baozhong/**', 'scripts/bz26-arch*', '.github/workflows/festival-arch.yml']
  push:
    branches: [main]
    paths: ['src/main.js', 'src/systems/baozhong/**', 'scripts/bz26-arch*', '.github/workflows/festival-arch.yml']
permissions:
  contents: read
jobs:
  arch-browser:
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check && node --test scripts/bz26-arch-invite.test.mjs && npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/bz26-arch-shots.mjs
        env:
          ARCH_PROFILE: ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: festival-arch-${{ matrix.profile }}
          path: test-results/festival-arch/
          retention-days: 7
