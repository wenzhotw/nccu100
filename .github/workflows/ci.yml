name: 檢查

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 結構與內容檢查
        run: npm run check
      - name: 打包
        run: npm run build
      - name: 安裝無頭瀏覽器
        run: npx playwright install --with-deps chromium
      - name: 冒煙測試
        run: npm run smoke
