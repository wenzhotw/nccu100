name: 檢查

on:
  pull_request:
  push:
    branches: [main]

# 測試只需要讀程式碼，不給寫入權限
permissions:
  contents: read

jobs:
  # 快速檢查：結構檢查、npm test、打包。可單獨設為合併前必須通過的檢查
  quick:
    runs-on: ubuntu-24.04
    # 近期 npm test 約 2.5 分鐘
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 結構與內容檢查
        run: npm run check
      - name: 效能基礎回歸測試
        run: npm test
      - name: 打包
        run: npm run build

  # 無頭瀏覽器冒煙測試較慢，獨立成一個 job 與 quick 平行執行。
  # 達賢四支瀏覽器測試改到 dah-hsian-nightly.yml，每天夜間或手動執行
  smoke:
    runs-on: ubuntu-24.04
    # 近期冒煙測試約 47 分鐘，留餘裕避免卡住時空等 6 小時
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 打包
        run: npm run build
      - name: 安裝無頭瀏覽器
        run: npx playwright install --with-deps chromium
      - name: 冒煙測試
        run: npm run smoke
      - name: 保留冒煙測試截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # 經 wenzhotw 核可：新增全角色面板專項，不刪舊 gate、不改部署權限。
  # 授權：Sentinel_1e88fbb3c1ac8191913f7eea33676102（2026-10-24）。
  actor-parts-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 打包同一候選
        run: npm run build
      - name: 安裝無頭瀏覽器
        run: npx playwright install --with-deps chromium
      - name: 全角色面板桌機與窄螢幕驗收
        run: node scripts/actor-parts-browser.mjs
      - name: 保留面板結果與截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actor-parts-browser
          path: test-results/actor-parts/
          if-no-files-found: warn
          retention-days: 7
