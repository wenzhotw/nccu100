<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四角色手臂試點｜NCCU100</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef5f3;color:#243c3c;font:16px system-ui,sans-serif}header{padding:20px 24px;background:#fff;border-bottom:1px solid #d7e3df}h1{font-size:23px;margin:0 0 6px}p{margin:6px 0;line-height:1.5}.layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 112px)}aside{padding:22px;background:#fff}label{display:block;margin:16px 0 7px;font-weight:650}select,button,input{font:inherit}select,button{padding:10px;border:1px solid #b5cbc4;border-radius:9px;background:#fff;width:100%;color:inherit}button{cursor:pointer;margin:6px 0}button.primary{background:#207a66;color:white}.row{display:flex;gap:6px}.row button{width:auto;flex:1}.viewport{position:relative;min-height:520px;overflow:hidden}.viewport canvas{display:block;width:100%;height:100%;touch-action:none}#trial-status{font-size:14px;white-space:pre-wrap;padding:12px;border-radius:10px;background:#edf5f1}small{display:block;line-height:1.5;color:#55716a}.badge{display:inline-block;padding:4px 10px;border-radius:20px;background:#d7eee6;font-size:13px}input[type=range]{width:100%}.overlay{position:absolute;left:18px;bottom:18px;padding:9px 13px;border-radius:8px;background:#ffffffdd;font-size:14px;pointer-events:none}@media(max-width:700px){.layout{grid-template-columns:1fr}aside{padding:14px 20px}.viewport{height:55vh;min-height:350px}header{padding:16px 20px}label{margin-top:10px}}
</style></head><body>
<header><span class="badge">Phase B1 · 開發預覽</span><h1>四角色手臂與道具掛載</h1><p>使用遊戲原始角色建構器。只測上肢，不代表膝關節、完整換裝或全角色遷移完成。</p></header>
<main class="layout"><aside>
<label for="trial-character">角色</label><select id="trial-character" disabled><option value="chiang">蔣學長</option><option value="player">主角</option><option value="bz26-D12">金融學系 · 平板</option><option value="bz26-D23">英國語文學系 · 袖口</option></select>
<label for="trial-pose">關鍵姿勢</label><select id="trial-pose" disabled><option value="neutral">中立</option><option value="walk">走路姿勢</option><option value="raise-hand">舉手</option><option value="wave">揮手</option><option value="sit">坐姿上肢測試（未屈膝）</option><option value="panic">驚慌</option></select>
<button id="trial-toggle" class="primary" disabled>切換原版中立對照</button><button id="trial-motion" disabled>播放連續手肘彎曲</button>
<label for="trial-bend">左右手肘角度：<span id="trial-angle">0°</span></label><input id="trial-bend" type="range" min="0" max="90" value="0" disabled>
<label>觀看角度</label><div class="row"><button data-view="front" disabled>前</button><button data-view="side" disabled>側</button><button data-view="back" disabled>後</button></div><button id="trial-reset" disabled>重設角色與鏡頭</button>
<p id="trial-status" role="status" aria-live="polite">載入真實角色與開發模組中……</p><small>可拖曳旋轉、滾輪縮放。此處不執行正式遊戲動畫；關鍵姿勢展示不能代替遊戲移動、雨傘或雄鷹形態回歸測試。</small>
</aside><section id="trial-viewport" class="viewport" aria-label="角色三維預覽"><div class="overlay">拖曳旋轉 · 滾輪縮放</div></section></main>
<script type="module" src="./arm-trial.js"></script></body></html>
